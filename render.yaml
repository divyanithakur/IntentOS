services:
  - type: web
    name: intentos-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1,intentos-3cxb.onrender.com"
      - key: FRONTEND_URL
        value: "https://intent-os-bzee.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: DATABASE_URL
        fromDatabase:
          name: intentos-db
          property: connectionString
      - key: DEMO_MODE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: intentos-db
    plan: free
